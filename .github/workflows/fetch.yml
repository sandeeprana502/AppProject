name: Fetch News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news-main

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch news
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          python fetch_news.py

      
      
      - name: Summarise news (AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_NEW_PER_RUN: "10"
          BATCH_SIZE: "5"
        run: |
          python -u summarize_news.py
          ls -lh data/

          echo "===== RUN SUMMARIZATION ====="
          python -u summarize_news.py

          echo "===== OUTPUT FILES ====="
          ls -lh data/

          echo "===== VERIFY OUTPUT ====="
          if [ ! -f data/summarized_news.json ]; then
            echo "ERROR: data/summarized_news.json was not created"
            exit 1
          fi

          echo "SUCCESS: summarized_news.json exists"



      - name: Save results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update news"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Successfully pushed news updates."
              exit 0
            fi

            echo "Push rejected. Fetching latest changes before retry."
            sleep 3
          done

          echo "Failed to push after 3 attempts."
          exit 1
