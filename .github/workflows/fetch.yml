
name: Fetch news

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Prevent simultaneous workflow runs from pushing together
concurrency:
  group: fetch-news-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python fetch_news.py

      - name: Save results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update news"

            # Get the latest remote changes
            git fetch origin main

            # Rebase our commit on top of remote changes
            git rebase origin/main

            # Push updated branch
            git push origin HEAD:main
          else
            echo "No changes to save."
          fi
